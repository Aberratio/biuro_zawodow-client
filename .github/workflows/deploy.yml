name: Deploy frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Where should the frontend be deployed?"
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      deploy_method:
        description: "How should the frontend be uploaded?"
        required: true
        default: ftp
        type: choice
        options:
          - ftp
          - ssh
      skipTests:
        description: "Skip frontend tests before build?"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
  DEPLOY_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_method || 'ftp' }}
  SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skipTests || false }}

jobs:
  deploy-staging:
    name: Deploy frontend staging
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'staging')
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        if: env.SKIP_TESTS != 'true'
        run: npm run check

      - name: Validate deploy method
        run: |
          set -Eeuo pipefail
          case "$DEPLOY_METHOD" in
            ftp|ssh) ;;
            "")
              echo "DEPLOY_METHOD is empty. Falling back to ftp."
              echo "DEPLOY_METHOD=ftp" >> "$GITHUB_ENV"
              ;;
            *)
              echo "DEPLOY_METHOD must be ftp or ssh."
              exit 20
              ;;
          esac

      - name: Build staging
        env:
          API_URL: ${{ secrets.API_URL }}
          VITE_SMARTLOOK_ENABLED: ${{ secrets.VITE_SMARTLOOK_ENABLED }}
          VITE_SMARTLOOK_PROJECT_KEY: ${{ secrets.VITE_SMARTLOOK_PROJECT_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_APP_ENV: staging
          VITE_STAGING_GATE_PASSWORD: ${{ secrets.VITE_STAGING_GATE_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [ -z "$API_URL" ]; then
            echo "API_URL is required in the selected GitHub Environment secrets."
            exit 21
          fi
          export VITE_API_URL="$API_URL"
          export VITE_SMARTLOOK_ENABLED="${VITE_SMARTLOOK_ENABLED:-false}"
          export VITE_SMARTLOOK_PROJECT_KEY="${VITE_SMARTLOOK_PROJECT_KEY:-}"
          export VITE_SENTRY_ENVIRONMENT=staging
          export VITE_APP_RELEASE="${GITHUB_SHA}"
          echo "Building staging frontend with API_URL from the staging GitHub Environment."
          npx vite build

      - name: Deploy by FTP
        if: env.DEPLOY_METHOD == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false

      - name: Package dist
        if: env.DEPLOY_METHOD == 'ssh'
        run: |
          set -Eeuo pipefail
          cd dist
          zip -r ../frontend.zip .

      - name: Configure SSH
        if: env.DEPLOY_METHOD == 'ssh'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "SSH_HOST, SSH_PORT and SSH_PRIVATE_KEY are required."
            exit 30
          fi

          case "$SSH_HOST" in
            http://*|https://*|*/*)
              echo "SSH_HOST must be a hostname only, for example h29.seohost.pl."
              exit 31
              ;;
          esac

          case "$SSH_PORT" in
            ''|*[!0-9]*)
              echo "SSH_PORT must be a number."
              exit 32
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts; then
            echo "Could not read SSH host key. Check SSH_HOST and SSH_PORT, and verify that SSH is enabled for this hosting account."
            exit 33
          fi

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ssh-keyscan returned no host keys. Check SSH_HOST and SSH_PORT."
            exit 34
          fi

      - name: Upload and unpack by SSH
        if: env.DEPLOY_METHOD == 'ssh'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FRONTEND_REMOTE_DIR: ${{ secrets.FRONTEND_REMOTE_DIR }}
          FRONTEND_ALLOWED_ROOT: ${{ secrets.FRONTEND_ALLOWED_ROOT }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSH_USER" ] || [ -z "$FRONTEND_REMOTE_DIR" ] || [ -z "$FRONTEND_ALLOWED_ROOT" ]; then
            echo "SSH_USER, FRONTEND_REMOTE_DIR and FRONTEND_ALLOWED_ROOT are required."
            exit 35
          fi

          DEPLOY_ID="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          REMOTE_ZIP="$FRONTEND_REMOTE_DIR/.deploy/frontend-${DEPLOY_ID}.zip"
          printf -v REMOTE_ENV 'FRONTEND_REMOTE_DIR=%q FRONTEND_ALLOWED_ROOT=%q REMOTE_ZIP=%q DEPLOY_ID=%q' "$FRONTEND_REMOTE_DIR" "$FRONTEND_ALLOWED_ROOT" "$REMOTE_ZIP" "$DEPLOY_ID"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$REMOTE_ENV bash -s" <<'REMOTE'
          set -Eeuo pipefail

          if [ -z "$FRONTEND_REMOTE_DIR" ]; then
            echo "FRONTEND_REMOTE_DIR is required."
            exit 10
          fi

          if [ -z "$FRONTEND_ALLOWED_ROOT" ]; then
            echo "FRONTEND_ALLOWED_ROOT is required."
            exit 13
          fi

          case "$FRONTEND_ALLOWED_ROOT" in
            /*) ;;
            *)
              echo "FRONTEND_ALLOWED_ROOT must be an absolute path."
              exit 18
              ;;
          esac

          case "$FRONTEND_REMOTE_DIR" in
            /|.|~|"$HOME")
              echo "FRONTEND_REMOTE_DIR cannot point to /, ., ~ or home."
              exit 14
              ;;
          esac

          case "$FRONTEND_REMOTE_DIR" in
            *..*)
              echo "FRONTEND_REMOTE_DIR cannot contain '..'."
              exit 11
              ;;
          esac

          command -v realpath >/dev/null
          FRONTEND_REMOTE_DIR_REAL="$(realpath -e "$FRONTEND_REMOTE_DIR")"
          FRONTEND_ALLOWED_ROOT_REAL="$(realpath -e "$FRONTEND_ALLOWED_ROOT")"

          case "$FRONTEND_REMOTE_DIR_REAL/" in
            "$FRONTEND_ALLOWED_ROOT_REAL"/*|"$FRONTEND_ALLOWED_ROOT_REAL/") ;;
            *)
              echo "FRONTEND_REMOTE_DIR is outside FRONTEND_ALLOWED_ROOT."
              echo "FRONTEND_REMOTE_DIR_REAL=$FRONTEND_REMOTE_DIR_REAL"
              echo "FRONTEND_ALLOWED_ROOT_REAL=$FRONTEND_ALLOWED_ROOT_REAL"
              exit 15
              ;;
          esac

          case "$FRONTEND_REMOTE_DIR_REAL" in
            *public_html|*public_html/*|*public_html/) ;;
            *)
              echo "FRONTEND_REMOTE_DIR must point to public_html or a directory inside public_html."
              exit 12
              ;;
          esac

          if [ ! -d "$FRONTEND_REMOTE_DIR_REAL" ]; then
            echo "FRONTEND_REMOTE_DIR must already exist."
            exit 16
          fi

          if [ ! -f "$FRONTEND_REMOTE_DIR_REAL/.biuro-zawodow-frontend-root" ]; then
            echo "Missing marker file: $FRONTEND_REMOTE_DIR_REAL/.biuro-zawodow-frontend-root"
            exit 17
          fi

          mkdir -p "$FRONTEND_REMOTE_DIR_REAL/.deploy"
          REMOTE

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" frontend.zip "$SSH_USER@$SSH_HOST:$REMOTE_ZIP"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$REMOTE_ENV bash -s" <<'REMOTE'
          set -Eeuo pipefail
          FRONTEND_REMOTE_DIR_REAL="$(realpath -e "$FRONTEND_REMOTE_DIR")"
          FRONTEND_ALLOWED_ROOT_REAL="$(realpath -e "$FRONTEND_ALLOWED_ROOT")"
          case "$FRONTEND_REMOTE_DIR_REAL/" in
            "$FRONTEND_ALLOWED_ROOT_REAL"/*|"$FRONTEND_ALLOWED_ROOT_REAL/") ;;
            *)
              echo "FRONTEND_REMOTE_DIR is outside FRONTEND_ALLOWED_ROOT."
              exit 15
              ;;
          esac
          REMOTE_ZIP="$FRONTEND_REMOTE_DIR_REAL/.deploy/frontend-${DEPLOY_ID}.zip"
          unzip -o -q "$REMOTE_ZIP" -d "$FRONTEND_REMOTE_DIR_REAL"
          rm -f "$REMOTE_ZIP"
          echo "Frontend unpacked into $FRONTEND_REMOTE_DIR_REAL"
          REMOTE

  deploy-production:
    name: Deploy frontend production
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'production'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
